# Extent Reports Cucumber 7 Adapter Configuration
# This file must be placed at src/test/resources/extent.properties

# Output path for the HTML report
extent.reporter.html.start=true
extent.reporter.html.out=test-output/ExtentReport.html

# Attach screenshots to failed steps in the report
screenshot.dir=test-output/screenshots/
screenshot.rel.path=../../test-output/screenshots/
